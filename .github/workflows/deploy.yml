name: Deploy to VPS

on:
  push:
    branches:
      - fasih_Branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Restart PM2
        run: |
          pm2 restart scratchclothing || pm2 start npm --name "scratchclothing" -- start
          pm2 save
